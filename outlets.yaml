# Reputable outlets for the NEWS lane only. The social scanner never reads this file.
#
# tier      weight  meaning
#  1         1.0    wire services and national news
#  official  0.9    government, courts, regulators, attorneys general (primary sources)
#  2         0.8    major tech and business press
#  3         0.6    specialist AI / tech-policy outlets and newsletters
#  4         0.5    local broadcast and regional press (state stories; usually found via search feeds)
#  company   0.5    AI company announcements (primary, but self-interested)
#  unlisted  0.3    anything not listed below: shown, weighted low
#  syndicated 0.2   aggregators that republish others (MSN, Yahoo); excluded from corroboration
#
# `feeds` are RSS/Atom URLs we poll directly. Outlets without feeds are reached through the
# search feeds (Google News / Bing News queries in config.yaml). Run `socialbot news feeds check`
# to see which feed URLs are alive.

tiers:
  "1": {weight: 1.0, label: "Wire / national"}
  official: {weight: 0.9, label: "Official / government"}
  "2": {weight: 0.8, label: "Major tech & business"}
  "3": {weight: 0.6, label: "Specialist AI & policy"}
  "4": {weight: 0.5, label: "Local & regional"}
  company: {weight: 0.5, label: "AI company"}
  unlisted: {weight: 0.3, label: "Unlisted"}
  syndicated: {weight: 0.2, label: "Syndicated copy"}   # never counts as an independent outlet

outlets:

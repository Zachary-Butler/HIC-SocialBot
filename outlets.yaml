# Never used as a source of text or facts for HIC copy, never counted as coverage: items from these
# domains are dropped at ingestion. Partisan or unreliable outlets in either political direction;
# a nonpartisan 501(c)(3) does not build posts on them. Zach and Will own this list.
never_source:
  - breitbart.com
  - dailycaller.com
  - thegatewaypundit.com
  - infowars.com
  - zerohedge.com
  - theepochtimes.com
  - naturalnews.com

[project]
name = "socialbot"
version = "0.1.0"
description = "HIC SocialBot: news roundup carousels and rapid-response alerts, human-approved, published through Buffer."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "httpx>=0.28",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "tldextract>=5.0",
    "pillow>=11.0",
    "playwright>=1.50",
    "googlenewsdecoder>=0.1.7",
    "selectolax<1.0",          # googlenewsdecoder still imports the pre-1.0 parser module
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
socialbot = "socialbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socialbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
